<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白話字拼讀組合器</title>
<style>
:root{--bg:#faf8f4;--fg:#2b2a27;--mut:#77736a;--card:#fff;--line:#e2ddd2;--ac:#c2410c;--acbg:#fde8dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c1a;--fg:#ece8df;--mut:#9b968a;--card:#2a2825;--line:#3d3a35;--ac:#fb923c;--acbg:#3b2a1d}}
:root[data-theme="dark"]{--bg:#1d1c1a;--fg:#ece8df;--mut:#9b968a;--card:#2a2825;--line:#3d3a35;--ac:#fb923c;--acbg:#3b2a1d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:18px;margin:4px 0 12px}
.tabs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.25fr) minmax(0,.6fr);gap:6px;margin-bottom:10.5px}
.tabs button{flex:1;height:37.5px;padding:0 6.75px;line-height:1.2;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font-size:21px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.out{background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center;padding:9px 10px 3.375px}
.word{font-size:42px;line-height:1.2;font-family:"Charis SIL","Gentium Plus","Noto Serif","Times New Roman",serif;min-height:57px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.tone-diagrams{position:relative;height:73px;margin-top:-5px}
.tone-diagrams svg{display:block;width:100%;height:73px;margin:0;transform-box:border-box;transform:translateX(-16.6666666667%)}
#sandhiSvg{position:absolute;left:0;top:0;transform:translateX(16.6666666667%)}
.base-tone-label{font-size:21px}
.lab{font-size:12px;color:var(--mut);margin:14px 0 6px}
.out + .lab{margin-top:5.25px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row button{padding:7px 11px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;font-size:16px;font-family:"Charis SIL","Gentium Plus","Noto Serif",serif}
.row button.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
.row button:disabled{opacity:.3}
.note{font-size:12px;color:var(--mut);margin-top:14px;line-height:1.5}
.play{margin-top:10px;padding:8px 16px;border-radius:20px;border:1px dashed var(--mut);background:none;color:var(--mut);font-size:13px}
.wf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{border:2px solid var(--fg);border-radius:18px;padding:10px;background:var(--card);min-height:230px;font-size:11px;display:flex;flex-direction:column;gap:6px}
.ph b{font-size:12px;text-align:center}
.bx{border:1px dashed var(--mut);border-radius:8px;padding:6px;text-align:center;color:var(--mut)}
.bx.f{flex:1;display:flex;align-items:center;justify-content:center}
.nodes{display:flex;flex-direction:column;align-items:center;gap:4px}
.nodes i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ac);display:block}
.nodes i:nth-child(even){margin-left:34px}.nodes i:nth-child(3n){margin-left:-30px}
.voice-player{display:block;width:100%;max-width:300px;height:18px;margin:5px auto 0}.voice-player[hidden]{display:none}.play:disabled{opacity:.5}#voiceStatus.has-source{color:var(--ac)}
.word-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;text-align:center}.word-row>#word{grid-column:1/3;grid-row:1;white-space:nowrap}.word-row>.source-hanzi{grid-column:2/4;grid-row:1;color:var(--ac);white-space:nowrap}
.playback-actions{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:-12.5px}.playback-actions>.play{white-space:nowrap}
.speed-control{display:flex;align-items:center;justify-content:center;gap:3px;min-width:0;height:37.5px;padding:1.875px 2.25px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:21px;white-space:nowrap}.speed-control select{flex:1;min-width:0;width:65px;max-width:72px;font:inherit;line-height:1.2;height:100%;min-height:0;padding:1.125px .75px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
.speed-control select:disabled{opacity:.5;cursor:default}

.homophones{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:1.875px;text-align:center;border-top:0;padding-top:3px}.homophones[hidden]{display:none}
.homophone-heading{display:flex;align-items:center;justify-content:center;flex-shrink:0;min-height:36px;margin:0;color:var(--mut);font-size:16px;white-space:nowrap}
.homophone-list{display:flex;flex:0 1 auto;min-width:0;flex-wrap:wrap;justify-content:center;gap:6px}.homophone-list button{min-width:36px;min-height:36px;padding:5px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);font:inherit;font-size:16px;cursor:pointer}.homophone-list button[aria-pressed="true"]{color:var(--ac);border-color:transparent;background:var(--acbg);font-weight:600}


#playSandhiMain:disabled{opacity:1}#playSandhiMain.has-recording{color:var(--ac)}
#mainSandhiSource{color:var(--ac);font-size:12px;line-height:1.4}#mainSandhiSource[hidden]{display:none}
.playback-actions{flex-wrap:wrap;column-gap:8px;row-gap:0}.playback-actions>.play{padding-inline:10px}
</style>
</head>
<body>
<div class="tabs"><button id="t1" class="on">自己拼音</button><button id="tAuto">自動拼音</button><label class="speed-control">速度 <select id="autoSpeed" disabled><option value="3" selected>3 秒</option><option value="5">5 秒</option><option value="7">7 秒</option><option value="10">10 秒</option></select></label><button id="tDictionary">辭庫</button></div>


<section id="dictionaryPanel" hidden aria-label="辭庫"><iframe id="dictionaryFrame" title="辭庫1999" allow="autoplay" style="display:block;width:100%;height:calc(100dvh - 96px);min-height:360px;border:0;border-radius:12px"></iframe></section>
<div id="p1">
  <div class="out">
    <div class="word-row"><div class="word" id="word">pa</div><div class="word source-hanzi" id="sourceHanzi" aria-label="例音中文">巴</div></div>
    <div class="tone-diagrams">
      <svg id="svg" viewBox="0 0 300 73" aria-label="第 1 聲變音前聲調符號：空白"><text class="base-tone-label" x="78.6666666667" y="37.5" text-anchor="end" dominant-baseline="middle" fill="var(--mut)">本音</text><line x1="106.6666666667" x2="193.3333333333" y1="63" y2="63" stroke="var(--line)"/><text x="90.6666666667" y="67" font-size="10" fill="var(--mut)">1</text><line x1="106.6666666667" x2="193.3333333333" y1="54.5" y2="54.5" stroke="var(--line)"/><text x="90.6666666667" y="58.5" font-size="10" fill="var(--mut)">2</text><line x1="106.6666666667" x2="193.3333333333" y1="37.5" y2="37.5" stroke="var(--line)"/><text x="90.6666666667" y="41.5" font-size="10" fill="var(--mut)">3</text><line x1="106.6666666667" x2="193.3333333333" y1="20.5" y2="20.5" stroke="var(--line)"/><text x="90.6666666667" y="24.5" font-size="10" fill="var(--mut)">4</text><line x1="106.6666666667" x2="193.3333333333" y1="12" y2="12" stroke="var(--line)"/><text x="90.6666666667" y="16" font-size="10" fill="var(--mut)">5</text></svg>
      <svg id="sandhiSvg" viewBox="0 0 300 73" aria-label="第 1 聲 → 第 7 聲變調後音調符號" data-target-tone="7"><text class="base-tone-label" x="221.3333333333" y="37.5" text-anchor="start" dominant-baseline="middle" fill="var(--mut)">變音</text><line x1="106.6666666667" x2="193.3333333333" y1="63" y2="63" stroke="var(--line)"/><text x="90.6666666667" y="67" font-size="10" fill="var(--mut)">1</text><line x1="106.6666666667" x2="193.3333333333" y1="54.5" y2="54.5" stroke="var(--line)"/><text x="90.6666666667" y="58.5" font-size="10" fill="var(--mut)">2</text><line x1="106.6666666667" x2="193.3333333333" y1="37.5" y2="37.5" stroke="var(--line)"/><text x="90.6666666667" y="41.5" font-size="10" fill="var(--mut)">3</text><line x1="106.6666666667" x2="193.3333333333" y1="20.5" y2="20.5" stroke="var(--line)"/><text x="90.6666666667" y="24.5" font-size="10" fill="var(--mut)">4</text><line x1="106.6666666667" x2="193.3333333333" y1="12" y2="12" stroke="var(--line)"/><text x="90.6666666667" y="16" font-size="10" fill="var(--mut)">5</text><path id="sandhiToneSymbol" d="M 125.53030303030303 37.5 L 174.46969696969697 37.5" fill="none" stroke="var(--ac)" stroke-width="3.090909090909091" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="playback-actions"><button class="play" type="button">▶ 播放教育部真人錄音</button><button id="playSandhiMain" class="play" type="button" disabled aria-pressed="false">播放變音</button><button id="autoToggle" class="play" type="button" hidden>暫停</button></div>
    <audio id="voice" class="voice-player" controls preload="metadata" playsinline webkit-playsinline aria-label="教育部真人錄音播放器"></audio>
    <section id="homophones" class="homophones" aria-label="同音字詞" hidden>
      <div class="homophone-heading"><span>同音字詞 <span id="homophoneCount"></span></span></div>
      <div id="homophoneList" class="homophone-list" role="group" aria-label="相同拼音與聲調的字詞"></div>
    </section>
    <div class="sub" id="voiceStatus" role="status" aria-live="polite"></div>
    <div id="mainSandhiSource" class="sub" role="status" aria-live="polite" hidden></div>
  </div>
  <div class="lab">子音</div><div class="row" id="ini"><button data-v="">∅</button><button data-v="p" class="on">p</button><button data-v="ph">ph</button><button data-v="b">b</button><button data-v="m">m</button><button data-v="t">t</button><button data-v="th">th</button><button data-v="n">n</button><button data-v="l">l</button><button data-v="k">k</button><button data-v="kh">kh</button><button data-v="g">g</button><button data-v="ng">ng</button><button data-v="h">h</button><button data-v="ch">ch</button><button data-v="chh">chh</button><button data-v="s">s</button><button data-v="j">j</button></div>
  <div class="lab">母音</div><div class="row" id="vow"><button data-v="a" class="on">a</button><button data-v="e">e</button><button data-v="i">i</button><button data-v="o">o</button><button data-v="o͘">o͘</button><button data-v="u">u</button><button data-v="ai">ai</button><button data-v="au">au</button><button data-v="ia">ia</button><button data-v="io">io</button><button data-v="iu">iu</button><button data-v="iuⁿ">iuⁿ</button><button data-v="oa">oa</button><button data-v="oe">oe</button><button data-v="o͘a">o͘a</button><button data-v="o͘e">o͘e</button><button data-v="ui">ui</button><button data-v="iau">iau</button><button data-v="oai">oai</button><button data-v="iat">iat</button><button data-v="ioat">ioat</button></div>
  <div class="lab">鼻母音 / 斷音</div><div class="row" id="cod"><button data-v="" class="on">∅</button><button data-v="ⁿ">ⁿ</button><button data-v="m">m</button><button data-v="n">n</button><button data-v="ng">ng</button><button data-v="p">p</button><button data-v="t">t</button><button data-v="k">k</button><button data-v="h">h</button></div>
  <div class="lab">聲調(斷音韻尾才能選第 4、8 聲)</div><div class="row" id="ton"><button data-v="1" class="on">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4" disabled>4</button><button data-v="5">5</button><button data-v="7">7</button><button data-v="8" disabled>8</button></div>
</div>

<script>
const D='\u0358',NA='\u207F';
const INI=['','p','ph','b','m','t','th','n','l','k','kh','g','ng','h','ch','chh','s','j'];
const VOW=["a", "e", "i", "o", "o͘", "u", "ai", "au", "ia", "io", "iu", "iuⁿ", "oa", "oe", "o͘a", "o͘e", "ui", "iau", "oai", "iat", "ioat"];
const COD=['','ⁿ','m','n','ng','p','t','k','h'];
const STOP=['p','t','k','h'];
const TON=[[1,'1','',[5,5]],[2,'2','\u0301',[5,1]],[3,'3','\u0300',[2,1]],[4,'4','',[3,2]],[5,'5','\u0302',[2,4]],[7,'7','\u0304',[3,3]],[8,'8','\u030D',[5,5]]];
const NAME={1:'陰平',2:'陰上',3:'陰去',4:'陰入',5:'陽平',7:'陽去',8:'陽入'};
let s={i:'p',v:'a',c:'',t:1};
const $=id=>document.getElementById(id);
function mk(el,arr,key,lab){el.innerHTML='';arr.forEach(x=>{const b=document.createElement('button');b.textContent=lab?lab(x):(x||'∅');b.dataset.v=x;b.onclick=()=>{s[key]=x;render();rememberManualSelection()};el.appendChild(b)})}
function place(v){ // index of vowel to mark
  const L=[...v];const base=v.replace(D,'').replace(/ⁿ/g,'');
  let t;
  if(base.includes('a'))t='a';else if(base.includes('o'))t='o';else if(base.includes('e'))t='e';
  else if(base==='iu')t='u';else if(base==='ui')t='i';else t=base[base.length-1];
  const idx=v.indexOf(t);return idx<0?0:idx;
}
function spell(tone=s.t){
  const tn=TON.find(x=>x[0]===tone);let v=s.v;
  if(tn[2]){const i=place(v);v=v.slice(0,i+1)+tn[2]+v.slice(i+1)}
  let c=s.c;
  return s.i+v+(c==='ⁿ'?NA:c);
}
function builtInEnding(){return /[ptkhⁿ]$/.test(s.v);}
function isStop(){return STOP.includes(s.c)||/[ptkh]$/.test(s.v);}
// Static pre-change geometry from the original POJ tone-animation project.
// Source grid: line 5 at y=70, line 1 at y=334; source symbol centered at x=175.
// Display uses a piecewise vertical mapping to compress only the two outer intervals.
const BEFORE_TONE_POINTS={
 1:[],
 2:[[121.5625,276.25],[228.4375,127.75]],
 3:[[121.5625,127.75],[228.4375,276.25]],
 4:[],
 5:[[80,249.5],[175,154.5],[270,249.5]],
 7:[[80,202],[270,202]],
 8:[[175,136],[175,235]]
};
// Outer pitch intervals are half the height of the two middle intervals.
const TONE_GRID_Y={1:63,2:54.5,3:37.5,4:20.5,5:12};
function mapToneY(sourceY){
 const targets=[12,20.5,37.5,54.5,63];
 const band=Math.max(0,Math.min(3,Math.floor((sourceY-70)/66)));
 return targets[band]+(sourceY-(70+band*66))/66*(targets[band+1]-targets[band]);
}
// Animation motions adapted from the original tone-classroom paint/firstCurve/roofPath.
const SANDHI_TONE_MAP={1:7,2:1,3:2,4:8,5:7,7:3,8:4};
const ANIMATION_CONTOURS={1:[5,5],2:[5,1],3:[2,1],4:[2,1],5:[2,4],7:[3,3],8:[4,4]};
function animationCurve(tone){
 const c=ANIMATION_CONTOURS[tone];
 return [80,70+(5-c[0])*66,80+([4,8].includes(tone)?115:190),70+(5-c[1])*66];
}
function animationFirstCurve(tone){
 if(tone===8)return [175,70,175,169];
 if(tone===2)return [121.5625,276.25,228.4375,127.75];
 if(tone===3)return animationFirstCurve(2).map((n,i)=>i%2?404-n:n);
 if(tone===7)return [80,202,270,202];
 return animationCurve(tone);
}
function rotateAnimationLine(a,radians){
 const cx=(a[0]+a[2])/2,cy=(a[1]+a[3])/2,c=Math.cos(radians),sin=Math.sin(radians);
 return a.map((n,i)=>i%2?cy+(a[i-1]-cx)*sin+(n-cy)*c:cx+(n-cx)*c-(a[i+1]-cy)*sin);
}
function sandhiAnimationGeometry(tone,progress){
 const p=Math.max(0,Math.min(1,progress)),ease=p*p*(3-2*p),a=animationFirstCurve(tone);
 let c,opacity=1,clip=false;
 if(tone===8){
  const travel=Math.max(0,Math.min(1,(p-.15)/.85)),drop=travel*travel*(3-2*travel)*320;
  // Retain the user's one-line downward translation and original vertical length.
  c=[175,136+drop,175,235+drop];clip=true;
 }else if(tone===4){
  const travel=Math.max(0,Math.min(1,(p-.15)/.85)),drop=travel*travel*(3-2*travel),bottomY=70+198*drop;
  c=[175,bottomY-80,175,bottomY];opacity=p<=.15?0:1;clip=true;
 }else if(tone===5){
  // Anchor the shrinking roof at the user's line-3 center, retaining its size.
  const offset=47.5*(1-ease);
  c=[80,202+offset,175,107+95*ease+offset,270,202+offset];
 }else if(tone===3||tone===7){
  c=rotateAnimationLine(a,(tone===7?Math.PI/4:-2*Math.atan2(a[3]-a[1],a[2]-a[0]))*ease);
 }else if(tone===2){
  const travel=Math.max(0,(p-.2)/.8),offset=travel*travel*(3-2*travel);
  c=a.map((n,i)=>n+(i%2?500:-360)*offset);clip=true;
 }else{
  const b=animationCurve(SANDHI_TONE_MAP[tone]);c=a.map((n,i)=>n+(b[i]-n)*ease);
 }
 const points=[];for(let i=0;i<c.length;i+=2)points.push([c[i],c[i+1]]);
 return {points,opacity,clip};
}
let sandhiAnimationFrame=0,sandhiAnimationState=null;
function pauseSandhiAnimation(){cancelAnimationFrame(sandhiAnimationFrame);sandhiAnimationFrame=0;}
function paintSandhiAnimation(progress){
 const state=sandhiAnimationState,path=$('sandhiToneSymbol');if(!state||!path)return;
 const frame=sandhiAnimationGeometry(state.tone,progress),scale=17/66;
 path.setAttribute('d',frame.points.map(([x,y],i)=>`${i?'L':'M'} ${150+(x-175)*scale} ${mapToneY(y)}`).join(' '));
 path.setAttribute('opacity',frame.opacity);
 path.setAttribute('clip-path',frame.clip?'url(#sandhiAnimationClip)':'none');
 path.dataset.progress=String(progress);state.progress=progress;
}
function tickSandhiAnimation(now){
 if(!sandhiAnimationState)return;
 const progress=Math.min(1,(now-sandhiAnimationState.start)/sandhiAnimationState.duration);
 paintSandhiAnimation(progress);
 sandhiAnimationFrame=progress<1?requestAnimationFrame(tickSandhiAnimation):0;
}
function startSandhiAnimation(tone,duration){
 pauseSandhiAnimation();
 const svg=$('sandhiSvg'),existing=$('sandhiToneSymbol');if(existing)existing.remove();
 const oldClip=svg.querySelector('defs');if(oldClip)oldClip.remove();
 const clipX=150+(-59-175)*17/66,clipY=mapToneY(52),clipHeight=mapToneY(352)-clipY;
 svg.insertAdjacentHTML('beforeend',`<defs><clipPath id="sandhiAnimationClip"><rect x="${clipX}" y="${clipY}" width="${1208*17/66}" height="${clipHeight}"/></clipPath></defs><path id="sandhiToneSymbol" fill="none" stroke="var(--ac)" stroke-width="${12*17/66}" stroke-linecap="round" stroke-linejoin="round"/>`);
 sandhiAnimationState={tone,duration:Math.max(1,duration),start:performance.now(),progress:0};
 svg.dataset.animationTone=String(tone);svg.dataset.targetTone=String(SANDHI_TONE_MAP[tone]);svg.dataset.duration=String(duration);
 svg.setAttribute('aria-label',`第 ${tone} 聲 → 第 ${SANDHI_TONE_MAP[tone]} 聲變調動畫`);
 paintSandhiAnimation(0);sandhiAnimationFrame=requestAnimationFrame(tickSandhiAnimation);
}

function showStaticSandhiTone(tone){
 const svg=$('sandhiSvg'),target=SANDHI_TONE_MAP[tone],points=BEFORE_TONE_POINTS[target];
 const existing=$('sandhiToneSymbol');if(existing)existing.remove();
 if(points.length){
  const scale=17/66,d=points.map(([x,y],i)=>`${i?'L':'M'} ${150+(x-175)*scale} ${mapToneY(y)}`).join(' ');
  svg.insertAdjacentHTML('beforeend',`<path id="sandhiToneSymbol" d="${d}" fill="none" stroke="var(--ac)" stroke-width="${12*scale}" stroke-linecap="round" stroke-linejoin="round"/>`);
 }
 svg.dataset.targetTone=String(target);
 svg.setAttribute('aria-label',`第 ${tone} 聲 → 第 ${target} 聲變調後音調符號${points.length?'':'：空白'}`);
}

function draw(){
 pauseSandhiAnimation();sandhiAnimationState=null;
 $('sandhiSvg').removeAttribute('data-animation-tone');
 $('sandhiSvg').removeAttribute('data-target-tone');
 $('sandhiSvg').removeAttribute('data-duration');
 const y=l=>TONE_GRID_Y[l];
 let g='<text class="base-tone-label" x="78.6666666667" y="37.5" text-anchor="end" dominant-baseline="middle" fill="var(--mut)">本音</text>';
 for(let l=1;l<=5;l++)g+=`<line x1="106.6666666667" x2="193.3333333333" y1="${y(l)}" y2="${y(l)}" stroke="var(--line)"/><text x="90.6666666667" y="${y(l)+4}" font-size="10" fill="var(--mut)">${l}</text>`;
 const points=BEFORE_TONE_POINTS[s.t];
 if(points.length){
  const scale=17/66;
  const d=points.map(([x,y],i)=>`${i?'L':'M'} ${150+(x-175)*scale} ${mapToneY(y)}`).join(' ');
  g+=`<path id="beforeToneSymbol" d="${d}" fill="none" stroke="var(--ac)" stroke-width="${12*scale}" stroke-linecap="round" stroke-linejoin="round"/>`;
 }
 $('svg').innerHTML=g;
 $('sandhiSvg').innerHTML=g.replace('id="beforeToneSymbol"','id="sandhiToneSymbol"')
  .replace('x="78.6666666667"','x="221.3333333333"').replace('text-anchor="end"','text-anchor="start"').replace('本音</text>','變音</text>');

  if(!saved||!INI.includes(saved.i)||!VOW.includes(saved.v)||!COD.includes(saved.c)||!TON.some(t=>t[0]===saved.t))return;
  if(/[ptkhⁿ]$/.test(saved.v)&&saved.c)return;
  const stop=STOP.includes(saved.c)||/[ptkh]$/.test(saved.v);
  if(stop?![4,8].includes(saved.t):[4,8].includes(saved.t))return;
  s={i:saved.i,v:saved.v,c:saved.c,t:saved.t};
 }catch{}
}

let HOMOPHONES={},homophoneKey='',selectedHomophone=null;
let autoRevealTimer=null,autoRevealGeneration=0,autoWordRevealed=false;
function refreshExampleDisplay(){
 const changed=$('tAuto').classList.contains('on')&&autoWordRevealed;
 const field=$('sourceHanzi');
 field.textContent=changed?spell(SANDHI_TONE_MAP[s.t]):selectedHomophone?.han||'';
 field.dataset.phase=changed?'sandhi':'chinese';
 field.setAttribute('aria-label',changed?'變音後白話字':'例音中文');
}
function clearAutoReveal(){
 if(autoRevealTimer!==null)clearTimeout(autoRevealTimer);
 autoRevealTimer=null;autoRevealGeneration++;
}
function scheduleAutoReveal(){
 if(!autoRunning||!$('tAuto').classList.contains('on'))return;
 const generation=autoRevealGeneration;
 autoRevealTimer=setTimeout(()=>{
  if(generation!==autoRevealGeneration||!autoRunning||!$('tAuto').classList.contains('on'))return;
  autoRevealTimer=null;autoWordRevealed=true;refreshExampleDisplay();
 },Number($('autoSpeed').value)*500);
}
function restartAutoReveal(){
 clearAutoReveal();autoWordRevealed=false;refreshExampleDisplay();scheduleAutoReveal();
}

function renderHomophones(){
 const key=voiceKey(spell())+'|'+s.t;
 const base=sourceChinese(activeClip);
 const entries=[],seen=new Set();
 for(const entry of [...(base?[{han:base,source:activeClip.source}]:[]),...(HOMOPHONES[key]||[])]){
  if(!seen.has(entry.han)){seen.add(entry.han);entries.push(entry);}
 }
 if(key!==homophoneKey){homophoneKey=key;selectedHomophone=null;}
 selectedHomophone=entries.find(entry=>entry.han===selectedHomophone?.han)||entries[0]||null;
 $('homophones').hidden=!entries.length;
 refreshExampleDisplay();
 $('homophoneList').replaceChildren();
 $('homophoneCount').textContent=entries.length?'（'+entries.length+'）':'';
 for(const entry of entries){
  const button=document.createElement('button');button.type='button';button.textContent=entry.han;
  button.setAttribute('aria-pressed',String(entry.han===selectedHomophone?.han));
  button.onclick=()=>{
   if(selectedHomophone?.han===entry.han)return;
   selectedHomophone=entry;renderHomophones();restartAutoCycle();
  };
  $('homophoneList').append(button);
 }
}
fetch('homophones.json',{credentials:'same-origin'}).then(response=>{
 if(!response.ok)throw Error('Homophone data unavailable');return response.json();
}).then(data=>{HOMOPHONES=data;renderHomophones();}).catch(()=>{
 $('homophones').title='同音字詞資料尚未載入，請重新整理網頁。';
});

const clipObjectURLs=new Map(),pendingClipLoads=new Map();
function prefetchClip(clip){
 if(!clip)return Promise.resolve(null);
 if(clipObjectURLs.has(clip.audio))return Promise.resolve(clipObjectURLs.get(clip.audio));
 if(pendingClipLoads.has(clip.audio))return pendingClipLoads.get(clip.audio);
 const task=fetch(clip.audio,{credentials:'same-origin'}).then(response=>{
  if(!response.ok)throw Error('Audio preload failed');return response.blob();
 }).then(blob=>{
  if(blob.size<128||blob.type&&!/audio|octet-stream/i.test(blob.type))throw Error('Unexpected audio response');
  // Use an explicit MP3 MIME type for iPhone playback of cached file data.
  const url=URL.createObjectURL(new Blob([blob],{type:'audio/mpeg'}));
  clipObjectURLs.set(clip.audio,url);
  for(const [key,cachedURL] of clipObjectURLs){
   if(clipObjectURLs.size<=6)break;
   if(key!==activeClip?.audio&&key!==playbackClip?.audio){clipObjectURLs.delete(key);URL.revokeObjectURL(cachedURL);}
  }
  return url;
 }).catch(()=>null).finally(()=>pendingClipLoads.delete(clip.audio));
 pendingClipLoads.set(clip.audio,task);return task;
}
function preferredAudioSource(clip){
 return clipObjectURLs.get(clip.audio)||clip.officialAudio||clip.audio;
}

function voiceKey(text){
 return text.toLowerCase().normalize('NFD').replace(/o([\u0300-\u030f]*)\u0358/g,'oo$1')
 .replace(/ⁿ/g,'nn').replace(/[\u0300-\u036f]/g,'').replace(/^tsh/,'chh').replace(/^ts/,'ch');
}
let playbackAttempt=0,playRequested=false,playbackFallback=null;
function sourceChinese(clip){
 const label=clip?.han?.trim()||'';
 return !/^拼音(?:\s|$)/u.test(label)&&/\p{Script=Han}/u.test(label)?label:'';
}
function updateVoice(){
 clearAutoReveal();autoWordRevealed=false;
 playbackAttempt++;playRequested=false;playbackFallback=null;
 voice.pause();
 activeClip=VOICES[voiceKey(spell())+'|'+s.t]||null;
 playbackClip=activeClip;playbackKind='base';sandhiButton.setAttribute('aria-pressed','false');mainSandhiSource.hidden=true;updateSandhiControl();
 renderHomophones();
 playButton.disabled=!activeClip;
 voiceStatus.classList.toggle('has-source',Boolean(activeClip));
 playButton.textContent=activeClip?'▶ 播放教育部真人錄音':'此組合尚無核對完成的錄音';
 voice.hidden=!activeClip;
 playButton.title='';
 voiceStatus.replaceChildren();
 if(activeClip){
  const audioSource=preferredAudioSource(activeClip);
  voice.preload=autoRunning?'auto':'metadata';
  if(voice.getAttribute('src')!==audioSource){voice.src=audioSource;voice.load();}
  voice.muted=false;voice.defaultMuted=false;voice.volume=1;
  prefetchClip(activeClip);
  const a=document.createElement('a');a.href=activeClip.source;a.target='_blank';a.rel='noopener';a.style.color='inherit';
  a.textContent='教育部例音來源 · '+activeClip.han;voiceStatus.append(a);
  const direct=document.createElement('a');direct.href=activeClip.source;direct.target='_blank';direct.rel='noopener';direct.style.color='inherit';
  direct.textContent='直接開啟音檔';voiceStatus.append(' · ',direct);
 }else{
  voice.removeAttribute('src');voice.load();
  const entry=MISSING[voiceKey(spell())+'|'+s.t];
  voiceStatus.textContent=entry?.label||'未找到辭典對應，需確認組合';
  const link=document.createElement('a');link.href='audio-audit.html?q='+encodeURIComponent(spell());link.textContent=' 查看核對結果';link.style.color='inherit';voiceStatus.append(link);
 }
 scheduleAutoReveal();
}
const originalRender=render;
render=function(){originalRender();updateVoice();};
function playbackFailure(error,attempt){
 if(attempt!==playbackAttempt||error?.name==='AbortError')return;
 if(playbackKind==='sandhi'){
  sandhiButton.setAttribute('aria-pressed','false');
  sandhiButton.title='變音播放失敗，請再點一次重試。';
  mainSandhiSource.hidden=false;
  mainSandhiSource.append(document.createElement('br'),'變音播放失敗，請重試或開啟上方教育部來源。');
  return;
 }
 const wasAutomatic=autoRunning;
 if(wasAutomatic){stopAuto();$('autoToggle').textContent='繼續';}
 playButton.textContent='▶ 重試播放';
 playButton.title=wasAutomatic
 ?'聲音未能啟動，請點「繼續」重新啟動自動發音。'
 :error?.name==='NotAllowedError'
 ?'請點下方播放器的 ▶；若仍無聲，請用 Safari 開啟此網頁。'
 :'播放未成功，請點下方播放器的 ▶ 或「直接開啟音檔」。';
}
function recoverPlayback(error,attempt){
 if(attempt!==playbackAttempt||error?.name==='AbortError'||!playbackClip)return;
 if(error?.name==='NotAllowedError'){prefetchClip(playbackClip);playbackFailure(error,attempt);return;}
 if(playbackFallback?.attempt===attempt)return playbackFallback.task;
 const clip=playbackClip,failedSource=voice.getAttribute('src');
 const fallback={attempt,task:null};playbackFallback=fallback;
 fallback.task=(async()=>{
  const cached=await prefetchClip(clip);
  if(attempt!==playbackAttempt||clip!==playbackClip)return;
  const alternatives=[...new Set([cached,clip.officialAudio,clip.audio].filter(url=>url&&url!==failedSource))];
  let lastError=error;
  for(const source of alternatives){
   if(attempt!==playbackAttempt||clip!==playbackClip||!playRequested)return;
   voice.src=source;voice.load();voice.muted=false;voice.volume=1;
   try{await voice.play();return;}catch(e){
    if(e?.name==='AbortError')return;
    lastError=e;if(e?.name==='NotAllowedError')break;
   }
  }
  playbackFailure(lastError,attempt);
 })();
 return fallback.task;
}
function playCurrent(kind='base'){
 const clip=kind==='sandhi'?mainSandhiClip:activeClip;
 if(!clip||kind==='sandhi'&&sandhiButton.disabled)return;
 playbackKind=kind;playbackClip=clip;
 sandhiButton.setAttribute('aria-pressed','false');
 if(kind==='sandhi'){showSandhiSource();playButton.textContent='▶ 播放教育部真人錄音';}
 else mainSandhiSource.hidden=true;
 const attempt=++playbackAttempt;playRequested=true;playbackFallback=null;
 voice.pause();voice.muted=false;voice.defaultMuted=false;voice.volume=1;
 const source=preferredAudioSource(clip);
 if(voice.getAttribute('src')!==source){voice.src=source;voice.load();}
 if(voice.readyState>0){try{voice.currentTime=0;}catch{}}
 if(kind==='base'){playButton.textContent='▶ 載入錄音…';playButton.title='正在準備錄音…';}else sandhiButton.title='正在準備變音錄音…';
 try{
  // Keep the first play() synchronous with the user's iPhone tap.
  const result=voice.play();
  if(result)result.catch(error=>recoverPlayback(error,attempt));
 }catch(error){recoverPlayback(error,attempt);}
}

playButton.onclick=()=>playCurrent();
sandhiButton.onclick=()=>playCurrent('sandhi');
voice.onplay=()=>{playRequested=true;};
voice.onplaying=()=>{if(playbackKind==='sandhi'){sandhiButton.setAttribute('aria-pressed','true');sandhiButton.title='正在播放變音配對錄音。';}else{playButton.textContent='◼ 播放中…';playButton.title='正在播放教育部真人錄音。';}};
voice.onended=()=>{if(playbackKind==='sandhi'){sandhiButton.setAttribute('aria-pressed','false');updateSandhiControl();}else{playButton.textContent='▶ 再聽一次';playButton.title='播放完成。';}};
voice.onpause=()=>{sandhiButton.setAttribute('aria-pressed','false');if(activeClip&&!voice.ended){playButton.textContent='▶ 播放教育部真人錄音';}};
voice.onwaiting=()=>{if(!voice.paused)(playbackKind==='sandhi'?sandhiButton:playButton).title='正在載入錄音，請稍候…';};
voice.onerror=()=>{
 if(!voice.error||!voice.getAttribute('src')||!playbackClip)return;
 if(playRequested){recoverPlayback(voice.error,playbackAttempt);return;}
 const clip=playbackClip,attempt=playbackAttempt;
 prefetchClip(clip).then(url=>{
  if(attempt!==playbackAttempt||clip!==playbackClip||playRequested)return;
  if(url&&voice.getAttribute('src')!==url){voice.src=url;voice.load();}
  else playbackFailure(voice.error,attempt);
 });
};
let autoTimer=null,autoChoices=null,lastAutoKey='',autoPrepared=null,autoRunning=false;
function stopAuto(){
 clearAutoReveal();
 pauseSandhiAnimation();
 if(autoTimer!==null)clearInterval(autoTimer);
 autoTimer=null;autoRunning=false;autoPrepared=null;playRequested=false;playbackAttempt++;playbackFallback=null;voice.pause();
}
function autoPool(){
 if(autoChoices)return autoChoices;
 const seen=new Set();autoChoices=[];
 for(const i of INI)for(const v of VOW)for(const c of COD){
  if(/[ptkhⁿ]$/.test(v)&&c)continue;
  for(const t of (STOP.includes(c)||/[ptkh]$/.test(v)?[4,8]:[1,2,3,5,7])){
   const key=voiceKey(i+v+c)+'|'+t,clip=VOICES[key];
   if(clip?.audio&&sourceChinese(clip)&&!seen.has(key)){
    seen.add(key);autoChoices.push({i,v,c,t,key});
   }
  }
 }
 return autoChoices;
}
function randomAutoChoice(){
 const choices=autoPool();if(!choices.length)return null;
 let selected=choices[Math.floor(Math.random()*choices.length)];
 if(selected.key===lastAutoKey&&choices.length>1)selected=choices[(choices.indexOf(selected)+1)%choices.length];
 return selected;
}
function nextAuto(){
 if(!autoRunning)return;
 const selected=autoPrepared||randomAutoChoice();autoPrepared=null;
 if(!selected)return;
 lastAutoKey=selected.key;s={i:selected.i,v:selected.v,c:selected.c,t:selected.t};
 render();playCurrent();
 if(autoRunning){autoPrepared=randomAutoChoice();if(autoPrepared)prefetchClip(VOICES[autoPrepared.key]);}
}
function startAuto(){
 stopAuto();autoRunning=true;$('autoToggle').textContent='暫停';
 nextAuto();
 if(autoRunning)autoTimer=setInterval(nextAuto,Number($('autoSpeed').value)*1000);
}
$('autoToggle').onclick=()=>{
 if(!autoRunning)startAuto();
 else{stopAuto();$('autoToggle').textContent='繼續';playButton.title='已暫停。';}
};
function restartAutoCycle(){
 if(!autoRunning||!$('tAuto').classList.contains('on'))return;
 clearInterval(autoTimer);
 restartAutoReveal();
 startSandhiAnimation(s.t,Number($('autoSpeed').value)*1000);
 autoTimer=setInterval(nextAuto,Number($('autoSpeed').value)*1000);
}
$('autoSpeed').onchange=()=>{
 if(!$('tAuto').classList.contains('on'))return;
 if(!autoRunning){startAuto();return;}
 restartAutoCycle();
};
$('autoSpeed').onclick=()=>{
 if($('tAuto').classList.contains('on')&&!autoRunning)startAuto();
};
restoreManualSelection();
render();
</script>
