<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<meta name="description" content="自己拼音、七調真人發聲、自動拼音與1,999筆例音，適合手機的白話字拼音學習。">
<title>辭庫</title><link rel="stylesheet" href="styles.css"><script type="module" src="app.mjs"></script>
<style>
.app{height:100dvh;border:0;border-radius:0;padding:0;gap:8px}
.page-switch{display:none}
.app[data-page=listen] .page-switch{display:flex}
.page-switch button{display:none}
.app[data-page=listen] #tab-examples{display:block;min-height:40px}
</style><link rel="stylesheet" href="combiner-theme.css">
</head>
<body><main class="app" id="app" data-page="build">
<nav class="page-switch" id="pageSwitch" role="tablist" aria-label="切換學習分頁">
<button id="tab-build" role="tab" data-page-choice="build" aria-selected="true" aria-controls="builderPanel" disabled>自己拼音初級</button>
<button id="tab-advanced" role="tab" data-page-choice="advanced" aria-selected="false" aria-controls="advancedBuilderPanel" disabled>自己拼音進階</button>
<button id="tab-auto" role="tab" data-page-choice="auto" aria-selected="false" aria-controls="autoBuilderPanel" disabled>自動拼音</button>
<button id="tab-listen" role="tab" data-page-choice="listen" aria-selected="false" aria-controls="player" disabled>聆聽</button>
<button id="tab-examples" role="tab" data-page-choice="examples" aria-selected="false" aria-controls="examplesPanel" disabled>← 返回辭庫</button>
</nav>
<div id="loadMessage" class="load-message" role="status">正在準備例音…</div>
<div class="workspace">
<section class="panel" id="builderPanel" role="tabpanel" aria-labelledby="tab-build">
<div class="builder">
<label class="onset-field">子音<select id="onset" aria-label="初級子音" disabled></select></label>
<label>母音<select id="final" aria-label="初級母音" disabled></select></label>
<label>音調<select class="tone-select" id="toneSelect" aria-label="初級音調" disabled></select></label>
<label for="combinedSound">呼音<output class="combined-sound" id="combinedSound" for="onset final toneSelect" aria-live="polite"></output></label>
</div><div class="tone-slot"></div><div class="formula-play-row"><div class="formula" id="formula"></div><button class="primary builder-play" id="builderPlay" disabled>選好後按 ▶ 聆聽這個拼音</button></div>
<p class="sub">初級只列單母音與相應韻尾；第 4、8 調請先選含 p、t、k、h 韻尾的母音。</p>
</section>
<section class="panel" id="advancedBuilderPanel" role="tabpanel" aria-labelledby="tab-advanced" hidden>
<div class="builder">
<label class="onset-field">子音<select id="advancedOnset" aria-label="進階子音" disabled></select></label>
<label>母音<select id="advancedFinal" aria-label="進階母音" disabled></select></label>
<label>音調<select class="tone-select" id="advancedToneSelect" aria-label="進階音調" disabled></select></label>
<label for="advancedCombinedSound">呼音<output class="combined-sound" id="advancedCombinedSound" for="advancedOnset advancedFinal advancedToneSelect" aria-live="polite"></output></label>
</div><div class="tone-slot"></div><div class="formula-play-row"><div class="formula" id="advancedFormula"></div><button class="primary builder-play" id="advancedBuilderPlay" disabled>選好後按 ▶ 聆聽這個拼音</button></div>
<p class="sub">加入雙母音、三母音與鼻音。所有可選組合都有對應的真人例音。</p>
</section>
<section class="panel" id="autoBuilderPanel" role="tabpanel" aria-labelledby="tab-auto" hidden>
<div class="builder">
<label class="onset-field">子音<select id="autoOnset" aria-label="自動子音" disabled></select></label>
<label>母音<select id="autoFinal" aria-label="自動母音" disabled></select></label>
<label>音調<select class="tone-select" id="autoToneSelect" aria-label="自動音調" disabled></select></label>
<label for="autoCombinedSound">呼音<output class="combined-sound" id="autoCombinedSound" aria-live="polite"></output></label>
</div><div class="tone-slot auto-tone-row"><label class="speed-field tone-speed"><span class="speed-title">速度</span><select id="autoToneSpeed" aria-label="音調列速度"><option value="3">3秒</option><option value="4">4秒</option><option value="5">5秒</option><option value="7">7秒</option><option value="10">10秒</option></select></label></div>
<div class="player" id="autoListen"></div>
</section>
<section class="panel" id="player" role="tabpanel" aria-labelledby="tab-listen" hidden><div class="tone-slot"></div><div class="player" id="listenHost"></div></section>
<section class="panel examples-panel" id="examplesPanel" role="tabpanel" aria-labelledby="tab-examples" hidden>
<div class="tone-slot"></div>
<div class="practice-tools" id="practiceTools">
<div class="practice-modes" role="group" aria-label="自測顯示方式"><button data-practice-mask="none" aria-pressed="true">全部顯示</button><button data-practice-mask="poj" aria-pressed="false">遮白話字自測</button><button data-practice-mask="han" aria-pressed="false">遮漢字自測</button><span class="practice-result-hint">點擊看結果</span></div>
<label class="practice-speed">調整速度<select id="practiceSpeed" aria-label="例音換序速度"><option value="3">3秒</option><option value="4">4秒</option><option value="5">5秒</option><option value="7">7秒</option><option value="10">10秒</option></select></label>
<span class="toolbar-sample-count" id="toolbarSampleCount"></span>
</div><div class="samples" id="samples" aria-label="真人例音，點選可聆聽"></div>
</section>
</div>
<nav class="tones" id="tones" aria-label="音調符號"></nav>
<div class="voice-display" id="voiceDisplay" hidden>
<div class="voice-text-columns"><div class="syllable" id="syllable"></div><div class="han" id="han"></div></div>
<section id="dictionaryMeanings" class="dictionary-meanings" aria-label="相同拼音與聲調的同音字詞" hidden><div class="meaning-label">同音字詞</div><div id="dictionaryMeaningList" class="dictionary-meaning-list"></div><p id="recordedHeadword" class="recorded-headword"></p></section><div class="listen-controls"><div class="playrow"><button class="primary" id="play" aria-pressed="false">▶ 本音</button><button class="primary" id="playSandhi" aria-pressed="false" disabled>▶ 變音</button><button class="secondary" id="stop">■ 停止</button></div><section class="tone-pair-info" aria-label="本音與變音配對錄音">
<div class="pair-example"><span>本音</span><div id="baseExample"></div><a id="baseSource" target="_blank" rel="noopener">教育部來源 ↗</a></div>
<div class="pair-example"><span>變音</span><div id="sandhiExample"></div><a id="sandhiSource" target="_blank" rel="noopener" hidden>教育部來源 ↗</a></div>
<p id="pairRule" class="pair-rule"></p><p class="pair-note">變音採另一例字的本調錄音作聲調示範，並非原字在詞語中的連讀錄音。</p>
<p id="pairStatus" class="pair-status" role="status" aria-live="polite"></p></section>
<div class="source-row" hidden><a id="sourceLink" target="_blank" rel="noopener">教育部・例音來源 ↗</a></div><div class="status" id="status" role="status" aria-live="polite" hidden>點選播放，聆聽真人例音。</div></div>
</div>
</main><audio id="voiceAudio" preload="auto" playsinline></audio></body></html>
