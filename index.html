/* iPhone 15 Plus portrait / compact-screen responsive layout */
html{width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{width:100%;min-width:0;overflow-x:hidden}
main,.panel,.topbar,.tabs,.tone-graph-wrap,.practice-quiz{min-width:0;max-width:100%}
#toneGraphWrap svg,#toneDescriptions{max-width:100%}
@media (max-width:600px){
  main{width:100%;padding:10px 10px calc(18px + env(safe-area-inset-bottom,0px))}
  #lessonPanel{padding:13px 10px 10px;border-radius:16px}
  .topbar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:12px}
  .topbar .tabs{grid-column:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;width:100%;min-width:0}
  .topbar .tabs button,.topbar #tab-principles{width:100%;min-width:0;height:42px;min-height:42px;padding:3px 2px;white-space:nowrap;font-size:clamp(12px,3.6vw,16px);line-height:1.25;overflow:hidden}
  .topbar .tone-speed{grid-column:1;justify-content:center;width:100%;height:36px;min-height:36px;font-size:15px}
  .topbar .tone-speed select{flex:0 1 112px;font-size:14px;height:28px;max-width:112px}
  .lesson-topbar{margin-top:0}
  #words,#principlesWords,#practiceWords{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%;margin-top:0}
  #words button,#principlesWords button,#practiceWords button{width:100%;min-width:0;height:38px;min-height:38px;padding:2px 3px;font-size:clamp(13px,3.8vw,17px);line-height:1.2;border-radius:10px}
  #lessonContent{--poj-display-size:clamp(22px,7vw,30px)}
  .poj.poj-double{max-width:100%;overflow-wrap:anywhere}
  .wordtitle{font-size:clamp(27px,8vw,36px)}
  .tone-graph-wrap{width:100%;overflow:visible}
  .tone-graph-wrap svg{display:block;width:100%;height:auto}
  .syllable-labels{grid-template-columns:repeat(2,minmax(0,1fr));max-width:100%;overflow-wrap:anywhere}
  .practice-quiz{--practice-poj-size:clamp(18px,5vw,23px)}
  .practice-quiz .question{overflow-wrap:anywhere;line-height:1.4}
  .practice-quiz .answers{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  #practice .practice-quiz .answers button{min-width:0;min-height:56px;padding:8px 3px;font-size:clamp(21px,6vw,30px);overflow-wrap:anywhere}
  .practice-quiz .practice-footer{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:5px}
  .practice-quiz .practice-footer button{font-size:clamp(12px,3.4vw,15px);padding:0 5px;min-width:0;min-height:40px;height:auto;white-space:normal}
  .practice-footer #practiceVerseSource{font-size:clamp(9px,2.65vw,12px);white-space:normal;overflow-wrap:anywhere}
  #practice .practice-quiz .question{top:0;margin:18px 0}
  .rulecards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  table{font-size:14px}td,th{padding:8px 4px}
}
@media (max-width:360px){#words,#principlesWords,#practiceWords{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* 2026-10-29: iPhone 15 Plus portrait (430 CSS px), 95% viewport width. */

  html,body{width:100%;max-width:100%;margin:0;overflow-x:clip}
  body{font-size:16px}
  main{width:95%;max-width:95%;margin:0 auto;padding:7px 0 max(16px,env(safe-area-inset-bottom,0px))}
  #lessonPanel{width:100%;max-width:100%;padding:12px 9px 14px;margin:0 auto;border-radius:14px}
  #principles,#animation,#practice,#lessonContent,#principlesLessonHost,#animationLessonHost,
  .practice-quiz,#quizArea,.tone-graph-wrap{max-width:100%;min-width:0}
  .topbar{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:7px;margin:0 0 10px}
  .topbar .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;grid-column:1;margin:0}
  .topbar .tabs button{width:100%;min-width:0;height:43px;min-height:43px;padding:4px 1px;font-size:clamp(13px,3.55vw,16px);white-space:nowrap}
  .topbar .tone-speed{grid-column:1;height:38px;min-height:38px;font-size:15px}
  .topbar .tone-speed select{width:auto;min-width:100px;max-width:125px;height:30px;font-size:15px}
  #words,#principlesWords,#practiceWords{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%;max-width:100%}
  #words button,#principlesWords button,#practiceWords button{width:100%;min-width:0;min-height:42px;height:auto;padding:6px 1px;font-size:clamp(13px,3.6vw,16px);white-space:normal;overflow-wrap:anywhere}
  #lessonContent{--poj-display-size:clamp(22px,6.5vw,29px)}
  #principles .rule-tone-pair{font-size:clamp(34px,12vw,52px)}
  .rule-one-graph-sample{font-size:clamp(36px,19vw,82px)}
  .poj,.poj.poj-double,.syllable-labels,.question{max-width:100%;overflow-wrap:anywhere}
  .tone-graph-wrap svg,#toneDescriptions{display:block;width:100%;height:auto;max-width:100%}
  .practice-quiz .answers{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  #practice .practice-quiz .answers button{min-width:0;max-width:100%;font-size:clamp(19px,6vw,27px);padding:8px 2px;overflow-wrap:anywhere}
  .practice-quiz .practice-footer{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:5px}
  .practice-quiz .practice-footer button{min-height:42px;height:auto;padding:4px 2px;white-space:normal;font-size:clamp(12px,3.3vw,15px)}
  #practiceVerseSource{min-width:0;max-width:100%;font-size:clamp(10px,2.5vw,12px);white-space:normal;overflow-wrap:anywhere}
  .controls{max-width:100%}
  .controls.playback-controls{gap:6px}
  .playback-controls>div{min-width:0;max-width:100%;flex-wrap:wrap}
  button,select{touch-action:manipulation}
}

/* Navigation: row one = two tabs; row two = practice tab and speed (50% each). */
.lesson-topbar{display:block!important;width:100%;margin-top:0}
.lesson-topbar .tabs{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important;width:100%!important;margin:0 0 12px!important;align-items:stretch}
.lesson-topbar .tabs>button{width:100%!important;min-width:0!important;max-width:100%!important;height:44px!important;min-height:44px!important;font-size:clamp(13px,3.7vw,17px)!important;padding:4px 3px!important;box-sizing:border-box}
.lesson-topbar .tabs>.tone-speed{grid-column:2;grid-row:2;display:flex!important;align-items:center!important;justify-content:center!important;gap:6px;width:100%!important;height:44px!important;min-height:44px!important;margin:0!important;padding:3px 5px!important;border:1px solid var(--line);border-radius:8px;box-sizing:border-box;font-size:clamp(13px,3.7vw,17px);white-space:nowrap}
.lesson-topbar .tabs>.tone-speed select{width:auto!important;max-width:55%!important;min-width:0!important;flex:1 1 auto!important;height:33px!important;font-size:clamp(12px,3.5vw,16px)!important}
.lesson-topbar #tab-principles{grid-column:1;grid-row:1}
.lesson-topbar #tab-animation{grid-column:2;grid-row:1}
.lesson-topbar #tab-practice{grid-column:1;grid-row:2}
@media(min-width:601px){.lesson-topbar .tabs{max-width:100%}.lesson-topbar .tabs>.tone-speed select{max-width:150px!important}}

/* 2026-10-30: Seven tone-change choices in two full-width rows (4 + 3). */
#principlesWords{
  display:grid!important;
  grid-template-columns:repeat(12,minmax(0,1fr))!important;
  gap:7px!important;
  width:100%!important;
  max-width:100%!important;
  margin-top:0;
  margin-bottom:10px;
}
#principlesWords>button{
  grid-column:span 3;
  width:100%!important;
  min-width:0!important;
  max-width:100%!important;
  box-sizing:border-box;
  white-space:nowrap;
  font-size:clamp(13px,3.6vw,17px);
}
#principlesWords>button:nth-child(n+5){grid-column:span 4}
@media(max-width:600px){
  #principlesWords>button{min-height:42px;padding:6px 2px}
}

/* 變音原則：第一排四欄、第二排三欄，依按鈕順序固定位置 */
#principles #principlesWords{display:grid!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;gap:7px!important;width:100%!important;max-width:100%!important}
#principles #principlesWords>button{width:100%!important;min-width:0!important;max-width:100%!important;box-sizing:border-box;white-space:nowrap;grid-column:span 3!important;grid-row:1}
#principles #principlesWords>button:nth-child(n+5):nth-child(-n+7){grid-column:span 4!important;grid-row:2}

/* 字詞動畫與變音練習：比照變音原則，七個選項分成四欄＋三欄。 */
#animation #words, #practice #practiceWords{
  display:grid!important;
  grid-template-columns:repeat(12,minmax(0,1fr))!important;
  gap:7px!important;
  width:100%!important;
  max-width:100%!important;
  margin-bottom:10px;
}
#animation #words>button, #practice #practiceWords>button{
  grid-column:span 3!important;
  grid-row:1;
  width:100%!important;
  min-width:0!important;
  max-width:100%!important;
  box-sizing:border-box;
  min-height:42px;
  height:auto;
  padding:6px 2px;
  font-size:clamp(13px,3.6vw,17px);
}
#animation #words>button:nth-child(n+5):nth-child(-n+7),
#practice #practiceWords>button:nth-child(n+5):nth-child(-n+7){
  grid-column:span 4!important;
  grid-row:2;
}

/* 變音練習：白話字一行、漢字另起置中；第一音節採用已選取頁籤的橘色。 */
#practice #question{display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:center;white-space:normal!important;max-width:100%;}
#practice #question .quiz-poj-line{display:block;white-space:nowrap;max-width:100%;font-size:clamp(16px,5vw,26px);line-height:1.3;letter-spacing:0;overflow:visible;}
#practice #question .quiz-first-syllable{color:var(--orange);}
#practice #question .quiz-hanzi-line{display:block;width:100%;text-align:center;font-size:clamp(21px,6vw,32px);line-height:1.35;color:var(--text);}
